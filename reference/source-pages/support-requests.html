function expenseTotal(){return calculateExpenseTotal(expenseItems) ?? Number.NaN;}
function mileageAmount(x){return calculateExpenseAmount({...x,category:'Mileage'}) ?? Number.NaN;}
function expenseDataField(i,k,label,{type='text',required=false,placeholder='',options=null,full=false,readonly=false,hint=''}={}){
  const x=expenseItems.find(e=>e.id===i)||{}, id=`ex_${i}_${k}`, hintId=id+'_hint';
  const described=hint?`aria-describedby="${esc(hintId)}"`:'';
  let inp=options?`<select id="${esc(id)}" data-expense="${i}" data-exkey="${esc(k)}" ${required?'required':''} ${described}><option value="">Select an option</option>${options.map(o=>{let [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${x[k]===v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`:`<input id="${esc(id)}" data-expense="${i}" data-exkey="${esc(k)}" type="${type}" ${required?'required':''} ${readonly?'readonly':''} ${described} ${type==='number'?`min="${k==='amount'?'0.01':'0'}" max="999999" step="${k==='amount'?'0.01':'any'}"`:''} ${type==='date'?`max="${expenseLocalToday()}"`:''} placeholder="${esc(placeholder)}" value="${esc(type==='number'&&readonly?expenseCalculatedDisplay(x):(x[k]??''))}">`;
  return `<div class="field ${full?'full':''}"><label for="${esc(id)}">${esc(label)} ${required?'<span class="req">*</span>':''}</label>${inp}${hint?`<span class="hint" id="${esc(hintId)}">${esc(hint)}</span>`:''}</div>`;
}

const HOLIDAY_ABSENCE_TYPES = Object.freeze(['sickness','maternity','paternity','adoption','compassionate','other']);

  sickness:['absenceStart','expectedReturn','currentlyOff','agencyNotified','absenceNotes'],

function holidayAbsenceText(value){return String(value??'').trim();}
function holidayAbsenceCalendarDate(value){
  const text=holidayAbsenceText(value);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(text))return false;
  const [year,month,day]=text.split('-').map(Number);
  if(year<1||month<1||month>12)return false;
  const leap=year%4===0&&(year%100!==0||year%400===0);
  return day>=1&&day<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][month-1];
}
function holidayAbsencePhone(value){
  const text=holidayAbsenceText(value),digits=text.replace(/\D/g,'');
  return text.length<=20&&/^\+?[0-9 ()-]+$/.test(text)&&digits.length>=7&&digits.length<=15;
}
function holidayAbsenceMoney(value){
  const text=holidayAbsenceText(value);
  if(!/^(?:\d+|\d*\.\d{1,2})$/.test(text))return false;
  const [rawPounds,fraction='']=text.split('.');
  const pounds=(rawPounds||'0').replace(/^0+(?=\d)/,''),pennies=fraction.padEnd(2,'0');
  const pence=Number(pounds+pennies),amount=Number(text);

  return Number.isSafeInteger(pence)&&pence>0&&pence<=Math.floor(Number.MAX_SAFE_INTEGER/2)&&Number.isFinite(amount)&&amount.toFixed(2)===pounds+'.'+pennies;
}
function holidayAbsenceActiveKeys(values){
  if(!Object.prototype.hasOwnProperty.call(HOLIDAY_ABSENCE_BRANCH_KEYS,values.absenceType))return [];
  const keys=HOLIDAY_ABSENCE_BRANCH_KEYS[values.absenceType];

function holidayAbsenceChecks(step,values,today){

/* Pure Expenses rules. No DOM, network, file-content access or persistent storage. */
const EXPENSE_CATEGORIES = ['Travel','Mileage','Subsistence','Accommodation','Equipment / materials','Other'];
const EXPENSE_TRAVEL_CATEGORIES = ['Travel','Mileage','Subsistence','Accommodation'];
const EXPENSE_VEHICLES = ['Car or van','Motorcycle','Bicycle','Other'];
const EXPENSE_FILE_LIMIT = 10 * 1024 * 1024;
// Leave sufficient precision for the final pound-value display as well as integer pence.
const EXPENSE_SAFE_PENCE = BigInt(Math.floor(Number.MAX_SAFE_INTEGER / 2));

function expenseText(value){
  return typeof value === 'string' ? value.trim() : '';
}

function expenseValidDate(value){
  if(typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [year,month,day] = value.split('-').map(Number);
  if(year < 1 || month < 1 || month > 12 || day < 1) return false;
  const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
  return day <= [31,leap ? 29 : 28,31,30,31,30,31,31,30,31,30,31][month-1];
}

function expenseDecimalParts(value){
  if(typeof value !== 'string' && typeof value !== 'number') return null;
  const raw = String(value).trim();
  if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)) return null;
  const numeric = Number(raw);
  if(!Number.isFinite(numeric) || numeric <= 0 || numeric > 999999) return null;
  let [whole,fraction=''] = raw.split('.');
  whole = (whole || '0').replace(/^0+(?=\d)/,'');
  fraction = fraction.replace(/0+$/,'');
  const units = BigInt(whole + fraction), scale = 10n ** BigInt(fraction.length);
  return units > 999999n * scale ? null : {units,scale};
}

function expenseRoundToPence(units,scale){
  const numerator = units * 100n;
  let pence = numerator / scale;
  if((numerator % scale) * 2n >= scale) pence += 1n;
  return pence > 0n && pence <= EXPENSE_SAFE_PENCE ? Number(pence) : null;
}

function calculateExpenseItemPence(item){
  if(!item || !EXPENSE_CATEGORIES.includes(item.category)) return null;
  if(item.category === 'Mileage'){
    const miles = expenseDecimalParts(item.miles), rate = expenseDecimalParts(item.rate);
    return miles && rate ? expenseRoundToPence(miles.units * rate.units,miles.scale * rate.scale) : null;
  }
  const amount = expenseDecimalParts(item.amount);
  if(!amount || (amount.units * 100n) % amount.scale !== 0n) return null;
  return expenseRoundToPence(amount.units,amount.scale);
}

function calculateExpenseAmount(item){
  const pence = calculateExpenseItemPence(item);
  return pence === null ? null : pence / 100;
}

function calculateExpenseTotal(items){
  if(!Array.isArray(items) || !items.length) return null;
  let total = 0n;
  for(const item of items){
    const pence = calculateExpenseItemPence(item);
    if(pence === null) return null;
    total += BigInt(pence);
    if(total > EXPENSE_SAFE_PENCE) return null;
  }
  return Number(total) / 100;
}

function expenseCalculatedDisplay(item){
  const amount = calculateExpenseAmount({...item,category:'Mileage'});
  return amount === null ? '' : amount.toFixed(2);
}

function expenseFileMetadataError(file){
  if(!file || typeof file !== 'object' || Array.isArray(file)) return 'Choose a PDF, JPG or PNG file, or remove the selection and explain why evidence is unavailable.';
  if(!expenseText(file.name) || !/\.(pdf|jpe?g|png)$/i.test(file.name)) return 'Choose a PDF, JPG or PNG file.';
  if(typeof file.size !== 'number' || !Number.isSafeInteger(file.size) || file.size <= 0 || file.size > EXPENSE_FILE_LIMIT) return 'Choose a non-empty file no larger than 10 MB.';
  if(file.type !== undefined && file.type !== '' && !['application/pdf','image/jpeg','image/png'].includes(file.type)) return 'Choose a PDF, JPG or PNG file.';
  return '';
}

function validateExpensesRequest(stage,data,files,items,today){
  const errors = [];
  const add = (key,message,step=stage) => errors.push({key,message,step});
  data = data && typeof data === 'object' ? data : {};
  files = files && typeof files === 'object' ? files : {};
  if(stage === 0){
    for(const [key,label] of [['first','first name'],['last','last name'],['agency','recruitment agency']]){
      if(!expenseText(data[key])) add(key,'Enter your ' + label + '.');
    }
    const email = expenseText(data.email);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) add('email','Enter a valid email address.');
    const phone = expenseText(data.phone);
    let digits = phone.replace(/\D/g,'');
    if(digits.startsWith('00')) digits = digits.slice(2);
    if(!/^\+?[0-9 ()-]+$/.test(phone) || digits.length < 9 || digits.length > 15) add('phone','Enter a valid mobile number, including the country code where needed.');
    if(!['agency','other'].includes(data.expenseRoute)) add('expenseRoute','Select how these expenses are being submitted.');

  }
  if(stage === 1 || stage === 2){

      const categoryValid = EXPENSE_CATEGORIES.includes(item.category);

      if(item.category === 'Mileage'){
        if(!EXPENSE_VEHICLES.includes(item.vehicle)) add(key('vehicle'),label + ': select an available vehicle type.');
        if(!expenseText(item.from)) add(key('from'),label + ': enter the journey start location.');
        if(!expenseText(item.to)) add(key('to'),label + ': enter the journey end location.');
        const miles = expenseDecimalParts(item.miles), rate = expenseDecimalParts(item.rate);
        if(!miles) add(key('miles'),label + ': enter miles greater than zero and no more than 999999, using a decimal number.');
        if(!rate) add(key('rate'),label + ': enter the requested rate greater than zero and no more than 999999, using a decimal number.');
        if(miles && rate && calculateExpenseItemPence(item) === null) add(key('rate'),label + ': the calculated request must be at least £0.01 and within the calculation limit.');
      }else if(categoryValid && calculateExpenseItemPence(item) === null){
        add(key('amount'),label + ': enter an amount from £0.01 to £999999 in whole pence.');
      }
    }
    if(!errors.length && calculateExpenseTotal(items) === null) add('expenseItems','The total is outside the calculation limit. Review the expense amounts.',1);
  }
  if(stage === 2){
    items.forEach((item,index) => {
      const fileKey = 'expenseFile_' + item.id, explanationKey = 'noReceipt_' + item.id;
      const hasFile = Object.prototype.hasOwnProperty.call(files,fileKey) && files[fileKey] !== null && files[fileKey] !== undefined;
      if(hasFile){
        const error = expenseFileMetadataError(files[fileKey]);
        if(error) add(fileKey,'Expense ' + (index+1) + ': ' + error);
      }else if(expenseText(data[explanationKey]).length < 12){
        add(explanationKey,'Expense ' + (index+1) + ': select supporting evidence or explain its absence and alternative evidence in at least 12 characters.');
      }
    });
  }
  if(stage === 3 && data.declaration !== true) add('declaration','Confirm the expenses declaration after reviewing your request.');
  return errors;
}

}
function supportFileError(meta) {
  if(!meta||typeof meta.name!=='string'||!meta.name.trim()||meta.name.length>255) return 'Choose a PDF, JPG or PNG file.';
  if(!/\.(pdf|jpg|jpeg|png)$/i.test(meta.name)) return 'Choose a PDF, JPG or PNG file.';
  if(!Number.isSafeInteger(meta.size)||meta.size<=0||meta.size>10*1024*1024) return 'Choose a non-empty file no larger than 10 MB.';
  if(meta.type&&!['application/pdf','image/jpeg','image/png'].includes(meta.type.toLowerCase())) return 'Choose a PDF, JPG or PNG file with a supported file type.';
  return '';
}
function clearSupportBranches(route,key,value,answers,selectedFiles) {
  const next={...answers}, nextFiles={...selectedFiles};
  if(next[key]===value) return {data:next,files:nextFiles,changed:false};
  const clear=keys=>keys.forEach(k=>delete next[k]);
  if(route==='change'&&key==='changeType') {
    Object.keys(next).forEach(k=>delete next[k]);
    Object.keys(nextFiles).forEach(k=>delete nextFiles[k]);
  }
  if(route==='absence'&&key==='absenceType') {
    Object.keys(next).filter(k=>!['first','last','email','phone','employee','agency'].includes(k)).forEach(k=>delete next[k]);
    Object.keys(nextFiles).forEach(k=>delete nextFiles[k]);
  }
  if(route==='holiday'&&key==='holidayArrangement') {
    clear(['first','last','email','phone','employee','agency','holidayStart','holidayEnd','agencyNotified','holidayNotes','paymentDate','paymentChoice','amountRequested']);
  }
  if(route==='holiday'&&key==='paymentChoice') clear(['amountRequested']);
  if(route==='change'&&key==='country'&&value==='UK') clear(['otherCountry']);
  if(route==='change'&&key==='otherType') {
    clear(['newFirst','newLast','nameNote','emergencyName','emergencyRelationship','emergencyPhone','emergencyNote','otherDescription']);
    delete nextFiles.changeEvidence;
  }
  if(route==='change'&&key==='newEmail') clear(['confirmNewEmail']);
  if(route==='absence'&&key==='otherAbsence') clear(['babyBirth','neonatalStart','absenceNotes']);
  if(route==='absence'&&key==='familyType') clear(['placementDate','plannedStart','plannedEnd','agencyNotified','absenceNotes']);
  if(route==='absence'&&key==='paternityReason') clear(['dueDate','plannedStart','duration','agencyNotified','absenceNotes']);
  if(route==='absence'&&key==='compassionateReason') clear(['relationship','absenceNotes']);
  if(route==='absence'&&['otherAbsence','familyType','paternityReason','compassionateReason'].includes(key)) {
    delete nextFiles.absenceEvidence;
  }
  if(route==='incident'&&key==='injuryOccurred') {
    clear(['injuryTo','injuredArea','injuryType','injuryDetails','firstAid','medicalTreatment','treatmentDetails','hospital','fitForWork','daysAffected','nonInjuryImpact']);
  }
  if(route==='incident'&&key==='injuryTo') {
    clear(['injuredArea','injuryType','injuryDetails','firstAid','medicalTreatment','treatmentDetails','hospital','fitForWork','daysAffected']);
  }
  if(route==='incident'&&key==='medicalTreatment'&&value!=='yes') clear(['treatmentDetails']);
  if(route==='incident'&&key==='witnesses'&&value!=='yes') clear(['witnessDetails']);
  if(route==='expenses'&&key==='expenseRoute') clear(['preApproved','approvalReference']);
  next[key]=value;
  if(key!=='declaration') next.declaration=false;
  return {data:next,files:nextFiles,changed:true};
}
function changeExpenseValue(items,id,key,value,answers,selectedFiles) {
  const nextItems=items.map(x=>({...x})), nextData={...answers}, nextFiles={...selectedFiles};
  const item=nextItems.find(x=>x.id===id);
  if(!item||item[key]===value) return {items:nextItems,data:nextData,files:nextFiles,changed:false};
  if(key==='category') {
    if(value!=='Mileage')['miles','rate','from','to','vehicle'].forEach(k=>delete item[k]);
    if(value==='Mileage')delete item.amount;
    if(!['Travel','Mileage','Subsistence','Accommodation'].includes(value))delete item.journeyType;
  }
  item[key]=value;nextData.declaration=false;
  return {items:nextItems,data:nextData,files:nextFiles,changed:true};
}
function clearExpenseApprovers(items){return items.map(item=>{const next={...item};delete next.approvedBy;return next;});}
function collectSupportErrors(route,stage,answers,selectedFiles,items,today,all=false) {
  const validators={holiday:validateHolidayRequest,change:validateChangeRequest,absence:validateAbsenceRequest,expenses:validateExpensesRequest,incident:validateIncidentRequest};
  if(!Object.hasOwn(validators,route)) return [{key:'stepHeading',message:'Choose a support request to continue.',step:0}];
  const result=[];
  for(let i=all?0:stage;i<=stage;i++) result.push(...validators[route](i,answers,selectedFiles,items,today));
  const reviewStage={holiday:3,change:2,absence:2,expenses:3,incident:4}[route];
  if(stage===reviewStage&&answers.declaration!==true) result.push({key:'declaration',message:'Please confirm the declaration after checking your answers.',step:reviewStage});
  for(const [key,value] of Object.entries(answers)) if(typeof value==='string'&&value.length>4000) result.push({key,message:'Please shorten this answer to 4,000 characters or fewer.',step:0});
  if(route==='expenses'&&stage>=1)for(const item of items)for(const [key,value] of Object.entries(item))if(typeof value==='string'&&value.length>4000)result.push({key:'ex_'+item.id+'_'+key,message:'Please shorten this expense answer to 4,000 characters or fewer.',step:1});
  const seen=new Set();
  return result.filter(e=>{const id=e.step+':'+e.key;if(seen.has(id))return false;seen.add(id);return true;}).sort((a,b)=>a.step-b.step);
}
function homeLink(){return '<a class="back" href="contractor-support.html">← Contractor Support</a>';}
function txt(k,l,{type='text',req=false,place='',hint='',full=false,attrs=''}={}) {
  const desc=hint?` aria-describedby="${esc(k)}-hint"`:'';
  const limit=['text','email','tel'].includes(type)&&!attrs.includes('maxlength=')?' maxlength="4000"':'';
  return `<div class="field ${full?'full':''}"><label for="${esc(k)}">${esc(l)}${req?' <span class="req">*</span>':''}</label><input id="${esc(k)}" data-key="${esc(k)}" name="${esc(k)}" type="${type}" ${req?'required':''} ${attrs}${limit}${desc} placeholder="${esc(place)}" value="${esc(data[k]??'')}">${hint?`<span id="${esc(k)}-hint" class="hint">${hint}</span>`:''}</div>`;
}
function textarea(k,l,{req=false,place='',full=true,hint=''}={}) {
  return `<div class="field ${full?'full':''}"><label for="${esc(k)}">${esc(l)}${req?' <span class="req">*</span>':''}</label><textarea id="${esc(k)}" name="${esc(k)}" data-key="${esc(k)}" maxlength="4000" ${req?'required':''}${hint?` aria-describedby="${esc(k)}-hint"`:''} placeholder="${esc(place)}">${esc(data[k]??'')}</textarea>${hint?`<span id="${esc(k)}-hint" class="hint">${hint}</span>`:''}</div>`;
}
function select(k,l,opts,{req=false,full=false,placeholder='Select an option'}={}) {
  return `<div class="field ${full?'full':''}"><label for="${esc(k)}">${esc(l)}${req?' <span class="req">*</span>':''}</label><select id="${esc(k)}" name="${esc(k)}" data-key="${esc(k)}" ${req?'required':''}><option value="">${esc(placeholder)}</option>${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${data[k]===v?'selected':''}>${esc(t)}</option>`;}).join('')}</select></div>`;
}
function choices(k,arr,{cols=2,label=''}={}) {
  const names={holidayArrangement:'How is your holiday pay handled?',paymentChoice:'How much accrued holiday pay are you requesting?',changeType:'What would you like to change?',bankOwnership:'Is this bank account in your own name?',absenceType:'What type of absence would you like to report?',expenseRoute:'How are these expenses being submitted?',preApproved:'What is the current authorisation status?',incidentNature:'What type of event are you reporting?',ongoingDanger:'Is there an immediate risk to anyone?',injuryOccurred:'Was anyone injured or made unwell?',injuryTo:'Who was injured or made unwell?'};
  return `<fieldset id="${esc(k)}" class="choice-fieldset" tabindex="-1"><legend class="sr-only">${esc(label||names[k]||pretty(k.replace(/([A-Z])/g,' $1')))}</legend><div class="choice-grid ${cols===3?'three':''}">${arr.map(([val,title,desc])=>`<label class="choice ${data[k]===val?'selected':''}"><input class="choice-radio" id="${esc(k)}--${esc(val)}" name="${esc(k)}" type="radio" data-choice="${esc(k)}" value="${esc(val)}" ${data[k]===val?'checked':''} required><strong>${esc(title)}</strong>${desc?`<small>${esc(desc)}</small>`:''}</label>`).join('')}</div></fieldset>`;
}
function radio(k,question,labels=['Yes','No']) {
  return `<div class="field full"><div class="fieldset-label">${esc(question)} <span class="req">*</span></div>${choices(k,labels.map(x=>[x.toLowerCase(),x,'']),{label:question})}</div>`;
}
function upload(k,l,opts={}) {
  const selected=files[k];
  return `<div class="field ${opts.full?'full':''}"><label for="${esc(k)}">${esc(l)}</label><input type="file" id="${esc(k)}" data-file="${esc(k)}" accept=".pdf,.jpg,.jpeg,.png" aria-describedby="${esc(k)}-hint"><span id="${esc(k)}-hint" class="file-note">PDF, JPG or PNG · up to 10 MB · example files only; nothing is uploaded</span>${selected?`<div class="file-summary">Selected for this preview: ${esc(selected.name)} (${Math.ceil(selected.size/1024)} KB). Only its name, size and type are held in page memory.</div><button class="inline-link" type="button" data-action="file-remove" data-file-key="${esc(k)}">Remove selected file</button>`:''}</div>`;
}
function homeUI() {
  return `<main id="main-content" class="main"><div class="wrap"><div class="workflow-panel form-panel"><div class="form-body"><h2 id="stepHeading" tabindex="-1">Choose your support request</h2><p>Return to Contractor Support to choose the request you need.</p><a class="btn primary" href="contractor-support.html">View support requests →</a><p>General questions and formal complaints use the <a class="inline-link" href="contact-us.html">Contact Us process</a>.</p></div></div></div></main>`;
}
function render(focusId='') {
  const heading=flow?FLOW_META[flow][0]:'Here when you need us.';
  const sub=flow?introByFlow():'Find the right support and understand what happens next.';
  const header=`<a class="skip-link" href="#main-content">Skip to content</a><header class="topbar"><div class="wrap top-inner"><a href="contractor-support.html" aria-label="EOS Contractor Support"><img class="eos-support-logo" src="../assets/eos-logo-official-reversed.png" alt="EOS — Progress. Together."></a><nav class="topnav" aria-label="Support navigation"><a href="knowledge-hub.html">Knowledge Hub</a><a href="contractor-support.html" class="active">Contractor Support</a><a class="pill" href="contact-us.html">Contact EOS →</a></nav></div></header><section class="hero"><div class="wrap">${flow?homeLink():''}<div class="eyebrow">${flow?'Contractor support · '+FLOW_META[flow][2]:'Contractor support'}</div><h1>${esc(heading)}</h1><p>${esc(sub)}</p></div></section>`;
  const strip=`<div class="demo-strip"><div class="wrap"><strong>Interactive design prototype:</strong> Use fictional details and example files only. Nothing is submitted or saved. Entries and file metadata remain in this page’s memory until you leave, reload or reset it.</div></div>`;
  $('#app').innerHTML=header+strip+(flow?workflowUI():homeUI())+`<footer class="footer"><div class="wrap"><a href="contractor-support.html" aria-label="EOS Contractor Support"><img class="eos-support-logo footer-brand" src="../assets/eos-logo-official-reversed.png" alt="EOS — Progress. Together."></a><div class="assist-links"><a href="knowledge-hub.html">Knowledge Hub</a><a href="contact-us.html">Contact Us</a><span>2026</span></div></div></footer>`;
  document.title='EOS | '+(flow?FLOW_META[flow][0]:'Contractor Support');
  decorateErrors();
  if(focusId) {
    const focus=document.getElementById(focusId)||document.getElementById('stepHeading');
    focus?.focus({preventScroll:focusId!=='stepHeading'});
  }
}
function errorSummaryHTML() {
  if(!activeErrors.length)return '';
  return `<div id="errorSummary" class="error-summary" tabindex="-1" role="alert"><h3>Please check the following</h3><ul>${activeErrors.map(e=>`<li><a href="#${esc(e.key)}" data-error-key="${esc(e.key)}">${esc(e.message)}</a></li>`).join('')}</ul></div>`;
}
function decorateErrors() {
  for(const err of activeErrors) {
    const target=document.getElementById(err.key);
    if(!target)continue;
    const id=err.key+'-error';
    const note=document.createElement('p');note.id=id;note.className='field-error b12-field-error';note.textContent=err.message;
    const group=target.tagName==='FIELDSET';
    const controls=group?[...target.querySelectorAll('input')]:[target];
    for(const input of controls) {
      input.setAttribute('aria-invalid','true');
      const desc=[input.getAttribute('aria-describedby'),id].filter(Boolean).join(' ');input.setAttribute('aria-describedby',desc);
    }
    (group?target:target.closest('.field')||target.parentElement).appendChild(note);
  }
}
function focusErrorKey(key) {
  const target=document.getElementById(key);
  if(!target){$('#errorSummary')?.focus();return;}
  const control=target.tagName==='FIELDSET'?(target.querySelector('input:checked')||target.querySelector('input')):target;
  control?.focus();
}
function announceStep() {
  const status=document.getElementById('journeyStatus');
  if(status)status.textContent=flow?`Step ${step+1} of ${FLOW_META[flow][3].length}: ${currentTitle()}`:'Choose a support request.';
}
function resetSupportState() {
  step=0;data={};files={};expenseSequence=1;expenseItems=[{id:1}];finished=false;activeErrors=[];
}
function nav(route) {
  resetSupportState();flow=allowedSupportRoute(route);
  if(location.protocol!=='about:')history.pushState({},'',location.pathname+(flow?'?flow='+flow:''));
  render('stepHeading');announceStep();
}
function showErrors(errors) {
  if(!errors.length)return;
  const firstStage=errors[0].step;
  if(Number.isInteger(firstStage)&&firstStage>=0&&firstStage<step)step=firstStage;
  activeErrors=errors.filter(e=>e.step===step);
  if(!activeErrors.length)activeErrors=[{key:'stepHeading',message:errors[0].message,step}];
  render();$('#errorSummary')?.focus();announceStep();
}
function validate() {
  const reviewStage=FLOW_META[flow][3].length-2;
  const errors=collectSupportErrors(flow,step,data,files,expenseItems,londonToday(),step===reviewStage);
  if(errors.length){showErrors(errors);return false;}
  activeErrors=[];return true;
}
function setSupportValue(key,value) {
  const result=clearSupportBranches(flow,key,value,data,files);
  data=result.data;files=result.files;
  if(result.changed&&flow==='expenses'&&key==='expenseRoute')expenseItems=clearExpenseApprovers(expenseItems);
  if(result.changed)activeErrors=[];
  if(result.changed&&key==='newEmail') {const confirm=document.getElementById('confirmNewEmail');if(confirm)confirm.value='';}
  return result.changed;
}
function refreshExpenseAmounts(id) {
  const item=expenseItems.find(x=>x.id===id), field=document.getElementById('ex_'+id+'_computed');
  if(item&&field)field.value=expenseCalculatedDisplay(item);
  const tally=$('.expense-tally');if(tally)tally.textContent='Total requested: '+money(expenseTotal());
}
document.addEventListener('click',event=>{
  const errorLink=event.target.closest('[data-error-key]');
  if(errorLink){event.preventDefault();focusErrorKey(errorLink.dataset.errorKey);return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  const act=button.dataset.action;
  if(act==='home'){location.assign('contractor-support.html');return;}
  if(!flow)return;
  if(act==='prev'||act==='go') {
    const dest=act==='prev'?step-1:Number(button.dataset.go);
    if(!Number.isInteger(dest)||dest<0||dest>=step)return;
    step=dest;data.declaration=false;finished=false;activeErrors=[];render('stepHeading');announceStep();return;
  }
  if(act==='next') {
    if(!validate())return;
    const last=FLOW_META[flow][3].length-1;
    if(step>=last)return;
    step++;finished=step===last;render('stepHeading');announceStep();return;
  }
  if(act==='expense-add') {
    expenseItems.push({id:++expenseSequence});data.declaration=false;activeErrors=[];render('ex_'+expenseSequence+'_category');return;
  }
  if(act==='expense-remove') {
    const id=Number(button.dataset.index);
    if(expenseItems.length<=1)return;
    expenseItems=expenseItems.filter(x=>x.id!==id);delete files['expenseFile_'+id];delete data['noReceipt_'+id];data.declaration=false;activeErrors=[];render('expenseItems');return;
  }
  if(act==='file-remove') {
    delete files[button.dataset.fileKey];data.declaration=false;activeErrors=[];render(button.dataset.fileKey);return;
  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.matches('[data-key]')&&el.tagName!=='SELECT'&&!['radio','checkbox'].includes(el.type))setSupportValue(el.dataset.key,el.value);
  if(el.matches('[data-expense]')&&el.tagName!=='SELECT') {
    const result=changeExpenseValue(expenseItems,Number(el.dataset.expense),el.dataset.exkey,el.value,data,files);
    expenseItems=result.items;data=result.data;files=result.files;
    if(result.changed)activeErrors=[];
    if(['miles','rate','amount'].includes(el.dataset.exkey))refreshExpenseAmounts(Number(el.dataset.expense));
  }
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.matches('[data-file]')) {
    const key=el.dataset.file;delete files[key];data.declaration=false;activeErrors=[];
    const item=el.files?.[0];
    if(item){const meta={name:item.name,size:item.size,type:item.type};const problem=supportFileError(meta);if(problem){activeErrors=[{key,message:problem,step}];render();$('#errorSummary')?.focus();return;}files[key]=meta;if(key.startsWith('expenseFile_'))delete data['noReceipt_'+key.slice('expenseFile_'.length)];}
    render(key);return;
  }
  if(el.matches('[data-choice]')) {setSupportValue(el.dataset.choice,el.value);render(el.id);return;}
  if(el.matches('[data-key]')) {
    setSupportValue(el.dataset.key,el.type==='checkbox'?el.checked:el.value);
    if(el.dataset.key==='declaration')render(el.id);
    if(el.tagName==='SELECT'&&['country','otherType','otherAbsence','familyType','paternityReason','compassionateReason','injuryTo','injuryType','hospital','daysAffected'].includes(el.dataset.key))render(el.id);
    return;
  }
  if(el.matches('[data-expense]')) {
    const result=changeExpenseValue(expenseItems,Number(el.dataset.expense),el.dataset.exkey,el.value,data,files);
    expenseItems=result.items;data=result.data;files=result.files;
    if(result.changed)activeErrors=[];
    if(['category','journeyType'].includes(el.dataset.exkey))render(el.id);
  }
});
window.addEventListener('popstate',()=>{resetSupportState();flow=allowedSupportRoute(new URLSearchParams(location.search).get('flow'));render('stepHeading');announceStep();});
render();

</script></body></html>
