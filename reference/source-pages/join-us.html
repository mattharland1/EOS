function cisSelfCalendarDate(value){
 const s=cisSelfText(value);if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number(s.slice(0,4))<1)return false;
 const timestamp=Date.parse(s+'T00:00:00Z');return Number.isFinite(timestamp)&&new Date(timestamp).toISOString().slice(0,10)===s;
}
function cisSelfNI(value){
 const s=cisSelfText(value).replace(/\s/g,'').toUpperCase();
 return /^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z]\d{6}[A-D]$/.test(s);
}
function cisSelfPhone(value){
 const s=cisSelfText(value);if(!/^\+?[0-9 ()-]+$/.test(s))return false;
 let digits=s.replace(/\D/g,'');if(s.startsWith('00'))digits=digits.slice(2);
 return digits.length>=9&&digits.length<=15;
}
function cisSelfBankSort(value){const s=cisSelfText(value);return /^[0-9\s-]+$/.test(s)&&s.replace(/[\s-]/g,'').length===6;}
function cisSelfBankAccount(value){const s=cisSelfText(value);return /^[0-9\s]+$/.test(s)&&s.replace(/\s/g,'').length===8;}
function cisSelfCompanyNumber(value){return /^[A-Z0-9]{8}$/i.test(cisSelfText(value).replace(/\s/g,''));}
function cisSelfVAT(value){return /^(?:GB|XI)?\d{9}$/i.test(cisSelfText(value).replace(/\s/g,''));}
function cisSelfBaseErrors(step,data,fields){
 const errors=[],active=fields.filter(field=>field.condition!==false);
 const add=(id,message)=>{if(!errors.some(error=>error.id===id))errors.push({id,message,step});};
 for(const field of active){
  const value=cisSelfText(data[field.id]);
  if(field.req&&(!value||(field.type==='checkbox'&&value!=='yes'))){add(field.id,field.type==='checkbox'?`Confirm: ${field.label}`:`Complete ${field.label}`);continue;}
  if(!value)continue;
  if((field.type==='select'||field.type==='radio')&&!field.options.some(option=>String(typeof option==='string'?option:option.v)===value))add(field.id,`Choose an available option for ${field.label}`);
  if(field.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))add(field.id,`Enter a valid email format for ${field.label}`);
  if(field.type==='date'&&!cisSelfCalendarDate(value))add(field.id,`Enter a real calendar date for ${field.label}`);
  if(field.type==='number'&&!Number.isFinite(Number(value)))add(field.id,`Enter a finite number for ${field.label}`);
  if(field.id==='mobile'&&!cisSelfPhone(value))add(field.id,'Enter a mobile number using digits and a recognised telephone format');
 }
 return {errors,active,add};
}
function cisSelfBankErrors(data,check){
 if(cisSelfText(data.sortCode)&&!cisSelfBankSort(data.sortCode))check.add('sortCode','Enter six sort-code digits, using spaces or hyphens only if needed');
 if(cisSelfText(data.accountNumber)&&!cisSelfBankAccount(data.accountNumber))check.add('accountNumber','Enter an eight-digit account number; letters are not allowed');
 const account=cisSelfText(data.accountNumber).replace(/\s/g,''),confirm=cisSelfText(data.confirmAccountNumber).replace(/\s/g,'');
 if(cisSelfText(data.confirmAccountNumber)&&(!cisSelfBankAccount(data.confirmAccountNumber)||confirm!==account))check.add('confirmAccountNumber','Enter the same eight-digit account number again');
}
function collectCisErrors(step,data,fields){
 const check=cisSelfBaseErrors(step,data,fields),has=id=>check.active.some(field=>field.id===id);
 if(step===0){
  if(cisSelfCalendarDate(data.dob)&&cisSelfText(data.dob)>cisSelfToday())check.add('dob','Date of birth cannot be in the future');
  if(cisSelfText(data.ni)&&!cisSelfNI(data.ni))check.add('ni','Enter two valid prefix letters, six digits and an A–D suffix for National Insurance');
 }
 if(step===1){
  if(data.country==='United Kingdom'&&cisSelfText(data.postcode)&&!/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i.test(cisSelfText(data.postcode)))check.add('postcode','Check the UK postcode format');
  const utrKey=data.businessType==='limited'?'companyUtr':'utr';
  if(has(utrKey)&&cisSelfText(data[utrKey])&&!/^\d{10}$/.test(cisSelfText(data[utrKey]).replace(/\s/g,'')))check.add(utrKey,'Enter a ten-digit UTR');
  if(data.businessType==='limited'&&has('companyNumber')&&cisSelfText(data.companyNumber)&&!cisSelfCompanyNumber(data.companyNumber))check.add('companyNumber','Enter the eight-character Companies House number, including leading zeros');
  if(data.vatRegistered==='yes'&&has('vatNumber')&&cisSelfText(data.vatNumber)&&!cisSelfVAT(data.vatNumber))check.add('vatNumber','Enter the nine-digit VAT registration number, with GB or XI if applicable');
 }
 if(step===2){
  if(cisSelfCalendarDate(data.startDate)&&cisSelfCalendarDate(data.endDate)&&data.endDate<data.startDate)check.add('endDate','End date cannot be before start date');
  if(cisSelfText(data.payRate)&&!(Number.isFinite(Number(data.payRate))&&Number(data.payRate)>0))check.add('payRate','Agreed rate must be a finite amount greater than zero');
  if(cisSelfText(data.daysWorked)&&(!Number.isInteger(Number(data.daysWorked))||Number(data.daysWorked)<1||Number(data.daysWorked)>7))check.add('daysWorked','Days worked must be a whole number from 1 to 7');
 }
 if(step===3)cisSelfBankErrors(data,check);
 return check.errors;
}
function collectSelfErrors(step,data,fields){
 const check=cisSelfBaseErrors(step,data,fields),has=id=>check.active.some(field=>field.id===id);
 if(step===0){
  const utrKey=data.businessType==='limited'?'companyUtr':'utr';
  if(has(utrKey)&&cisSelfText(data[utrKey])&&!/^\d{10}$/.test(cisSelfText(data[utrKey]).replace(/\s/g,'')))check.add(utrKey,'Enter a ten-digit UTR');
  if(data.businessType==='limited'&&has('companyNumber')&&cisSelfText(data.companyNumber)&&!cisSelfCompanyNumber(data.companyNumber))check.add('companyNumber','Enter the eight-character Companies House number, including leading zeros');
  if(data.vatRegistered==='yes'&&has('vatNumber')&&cisSelfText(data.vatNumber)&&!cisSelfVAT(data.vatNumber))check.add('vatNumber','Enter the nine-digit VAT registration number, with GB or XI if applicable');
 }
 if(step===1){
  if(data.country==='United Kingdom'&&cisSelfText(data.postcode)&&!/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i.test(cisSelfText(data.postcode)))check.add('postcode','Check the UK postcode format');
  if(cisSelfText(data.agreedRate)&&!(Number.isFinite(Number(data.agreedRate))&&Number(data.agreedRate)>0))check.add('agreedRate','Agreed rate must be a finite amount greater than zero');
 }
 if(step===2){
  if(cisSelfCalendarDate(data.dob)&&cisSelfText(data.dob)>cisSelfToday())check.add('dob','Date of birth cannot be in the future');
  if(has('ni')&&cisSelfText(data.ni)&&!cisSelfNI(data.ni))check.add('ni','Enter two valid prefix letters, six digits and an A–D suffix for National Insurance');
  cisSelfBankErrors(data,check);
 }
 if(step===3&&cisSelfCalendarDate(data.startDate)&&cisSelfCalendarDate(data.endDate)&&data.endDate<data.startDate)check.add('endDate','End date cannot be before start date');
 return check.errors;
}

function nextCisStep(){return nextRegistrationStep("cis",collectCisErrors,["agreementAccuracy", "agreementCIS", "agreementTerms", "agreementPrivacy"]);}
// Route-specific, side-effect-free format checks for the reviewed prototype.
// These checks do not verify identity, registration, eligibility or bank ownership.
function umbrellaAgencyLocalDay(){
 const today=new Date();
 return [today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
}
function umbrellaAgencyCalendarDate(value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
 const [year,month,day]=value.split('-').map(Number);
 if(year<1||month<1||month>12||day<1||day>31)return false;
 const date=new Date(0);date.setUTCHours(0,0,0,0);date.setUTCFullYear(year,month-1,day);
 return date.getUTCFullYear()===year&&date.getUTCMonth()===month-1&&date.getUTCDate()===day;
}
function umbrellaAgencyBaseErrors(step,data,fields){
 const errors=[];
 const add=(id,message)=>{if(!errors.some(error=>error.id===id))errors.push({id,message,step});};
 for(const field of fields.filter(field=>field.condition!==false)){
  const value=String(data[field.id]??'').trim();
  if(field.req&&(!value||(field.type==='checkbox'&&value!=='yes'))){add(field.id,field.label+' is required.');continue;}
  if(!value)continue;
  if((field.type==='select'||field.type==='radio')&&!field.options.some(option=>String(typeof option==='string'?option:option.v)===value))add(field.id,'Choose an available option for '+field.label.toLowerCase()+'.');
  if(field.type==='checkbox'&&!['yes','no'].includes(value))add(field.id,'Check the selection for '+field.label.toLowerCase()+'.');
  if(field.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))add(field.id,'Enter a valid '+field.label.toLowerCase()+'.');
  if(field.type==='tel'){
   const digits=value.replace(/^00/,'').replace(/\D/g,'');
   const minimum=field.id==='mobile'?9:7;
   if(!/^\+?[0-9 ()-]+$/.test(value)||digits.length<minimum||digits.length>15)add(field.id,'Enter a telephone number using digits, with an optional country code.');
  }
  if(field.type==='date'&&!umbrellaAgencyCalendarDate(value))add(field.id,'Enter a real calendar date for '+field.label.toLowerCase()+'.');
  if(field.type==='number'&&(!/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(value)||!Number.isFinite(Number(value))))add(field.id,'Enter a valid number for '+field.label.toLowerCase()+'.');
 }
 return {errors,add};
}
function umbrellaAgencyBankErrors(data,add){
 const sort=String(data.sortCode??'').trim(),account=String(data.accountNumber??'').trim(),confirmation=String(data.confirmAccountNumber??'').trim();
 const normalizedAccount=account.replace(/ /g,''),normalizedConfirmation=confirmation.replace(/ /g,'');
 if(sort&&(!/^[0-9 -]+$/.test(sort)||!/^\d{6}$/.test(sort.replace(/[ -]/g,''))))add('sortCode','Enter six sort-code digits; spaces and hyphens are allowed.');
 if(account&&(!/^[0-9 ]+$/.test(account)||!/^\d{8}$/.test(normalizedAccount)))add('accountNumber','Enter eight account-number digits; spaces are allowed.');
 if(confirmation&&(!/^[0-9 ]+$/.test(confirmation)||!/^\d{8}$/.test(normalizedConfirmation)||normalizedConfirmation!==normalizedAccount))add('confirmAccountNumber','Re-enter the same eight-digit account number.');
}
function umbrellaAgencyPostcode(value){
 return /^(?:GIR0AA|[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2})$/i.test(String(value??'').replace(/\s/g,''));
}
function collectUmbrellaErrors(step,data,fields,today=umbrellaAgencyLocalDay()){
 const {errors,add}=umbrellaAgencyBaseErrors(step,data,fields);
 if(step===0){
  const dob=String(data.dob??'').trim(),ni=String(data.ni??'').replace(/\s/g,'').toUpperCase();
  if(dob&&umbrellaAgencyCalendarDate(dob)&&dob>today)add('dob','Date of birth cannot be in the future.');
  if(ni&&(!/^[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z]\d{6}[A-D]$/.test(ni)||/^(?:BG|GB|KN|NK|NT|TN|ZZ)/.test(ni)))add('ni','Check the National Insurance number: two permitted letters, six digits and a final A, B, C or D.');
  if(data.country==='United Kingdom'&&String(data.postcode??'').trim()&&!umbrellaAgencyPostcode(data.postcode))add('postcode','Enter a valid UK postcode.');
 }
 if(step===1){
  if(String(data.payRate??'').trim()&&!(Number.isFinite(Number(data.payRate))&&Number(data.payRate)>0))add('payRate','Assignment rate must be greater than zero.');
  if(String(data.expectedHours??'').trim()&&!(Number.isFinite(Number(data.expectedHours))&&Number(data.expectedHours)>=1&&Number(data.expectedHours)<=168))add('expectedHours','Expected hours must be between 1 and 168.');
  if(umbrellaAgencyCalendarDate(String(data.startDate??''))&&umbrellaAgencyCalendarDate(String(data.endDate??''))&&data.endDate<data.startDate)add('endDate','End date cannot be before start date.');
 }
 if(step===2)umbrellaAgencyBankErrors(data,add);
 return errors;
}
function collectAgencyErrors(step,data,fields){
 const {errors,add}=umbrellaAgencyBaseErrors(step,data,fields);
 if(step===0){
  const company=String(data.companyNumber??'').replace(/\s/g,'').toUpperCase();
  if(company&&!/^[A-Z0-9]{8}$/.test(company))add('companyNumber','Enter the eight-character company number, including any leading zeros.');
  const vat=String(data.vatNumber??'').replace(/\s/g,'').toUpperCase();
  if(data.vatRegistered==='yes'&&vat&&!/^(?:GB|XI)?\d{9}$/.test(vat))add('vatNumber','Enter nine VAT-number digits, with an optional GB or XI prefix.');
  for(const prefix of ['reg',...(data.tradingSame==='no'?['trading']:[]),...(data.invoiceSame==='no'?['invoice']:[])]){
   if(data[prefix+'country']==='United Kingdom'&&String(data[prefix+'postcode']??'').trim()&&!umbrellaAgencyPostcode(data[prefix+'postcode']))add(prefix+'postcode','Enter a valid UK '+(prefix==='reg'?'registered-address':prefix+'-address')+' postcode.');
  }
 }
 if(step===1)umbrellaAgencyBankErrors(data,add);
 return errors;
}

function nextUmbrellaStep(){
 return nextRegistrationStep('umbrella',collectUmbrellaErrors,['agreementAccuracy','agreementPrivacy','agreementOnboarding']);
}

function registrationFieldLimit(field){
 if(field.type==='textarea')return 2000;
 if(field.type==='email')return 254;
 if(field.type==='url')return 2048;
 if(field.type==='tel')return 40;
 if(/accountNumber|confirmAccountNumber|sortCode|utr|ni$|companyNumber|vatNumber/i.test(field.id))return 40;
 return 200;
}
function registrationFocus(id){
 let target=document.getElementById(id);
 if(target?.tagName==='FIELDSET')target=target.querySelector('input:checked')||target.querySelector('input');
 if(target){target.focus({preventScroll:true});target.scrollIntoView({block:'center',behavior:'auto'});}
}
function focusRegistrationHeading(){registrationFocus('registration-step-title');}
function showRegistrationErrors(errors){
 if(!errors.length)return;
 const firstStep=Number.isInteger(errors[0].step)?errors[0].step:state.step;
 state.step=firstStep;state.demo=false;state.errors={};
 const shown=errors.filter(e=>!Number.isInteger(e.step)||e.step===firstStep);
 shown.forEach(e=>{state.errors[e.id]=e.message;});render();
 const summary=document.getElementById('formError');
 if(!summary)return;
 summary.innerHTML='<h3>Please check these details</h3><ul>'+shown.map(e=>{
  const target=/^agreement/.test(e.id)?e.id:state.route+'_'+e.id;
  return `<li><a href="#${esc(target)}" data-error-focus="${esc(target)}">${esc(e.message)}</a></li>`;
 }).join('')+'</ul>';
 summary.tabIndex=-1;summary.setAttribute('role','alert');summary.focus({preventScroll:true});summary.scrollIntoView({block:'center',behavior:'auto'});
}
function advanceRegistrationStep(){state.step++;state.errors={};render();focusRegistrationHeading();}
function completeRegistrationPreview(){state.demo=true;state.errors={};render();focusRegistrationHeading();}
function nextRegistrationStep(route,validator,declarations){
 if(state.route!==route||state.demo)return;
 const finalStep=routes[route].steps.length-1,values=state.values[route],isFinal=state.step===finalStep;
 let errors=[];
 const checkStep=step=>{
  const fields=groupData(route,step).flatMap(group=>group.fields);
  const issues=validator(step,values,fields);
  fields.filter(field=>field.condition!==false).forEach(field=>{
   if(String(values[field.id]??'').length>registrationFieldLimit(field))issues.push({id:field.id,message:`Keep ${field.label.toLowerCase()} within ${registrationFieldLimit(field)} characters.`,step});
  });
  return issues;
 };
 if(isFinal){
  for(let step=0;step<finalStep;step++)errors.push(...checkStep(step));
  declarations.forEach(id=>{const input=document.getElementById(id);values[id]=input?.checked?'yes':'no';});
  if(!errors.length)declarations.forEach(id=>{if(values[id]!=='yes')errors.push({id,message:'Confirm '+(document.getElementById(id)?.closest('label')?.textContent||'the required preview acknowledgement').replace(/\s*\*\s*$/,'').trim(),step:finalStep});});
 }else errors=checkStep(state.step);
 const seen=new Set();errors=errors.filter(e=>{const key=e.step+':'+e.id;if(seen.has(key))return false;seen.add(key);return true;});
 if(errors.length){showRegistrationErrors(errors);return;}
 if(isFinal)completeRegistrationPreview();else advanceRegistrationStep();
}
function invalidateRegistrationDeclarations(route){
 const values=state.values[route];Object.keys(values).filter(key=>/^agreement/.test(key)).forEach(key=>{values[key]='no';});
 document.querySelectorAll('.agree-list input[type="checkbox"]').forEach(input=>{input.checked=false;});
}
function updateRegistrationValue(route,key,value){
 const values=state.values[route],previous=values[key];
 if(previous===value)return false;
 values[key]=value;invalidateRegistrationDeclarations(route);delete state.errors[key];
 const clear=keys=>keys.forEach(id=>{delete values[id];delete state.errors[id];});
 if(key==='businessType'){
  clear(['utr','companyUtr','businessName','registeredName','companyNumber','tradingName','companyDirector','directorConfirm','vatNumber','accountName','sortCode','accountNumber','confirmAccountNumber','bankName','bsr','accountOwner','paymentConfirm']);
  if(route==='self')clear(['ni']);
  values.vatRegistered='no';
 }
 if(key==='vatRegistered'&&value==='no')clear(['vatNumber']);
 if(route==='agency'){
  if(key==='tradingSame'&&value==='yes')clear(['tradingaddress1','tradingaddress2','tradingcity','tradingpostcode','tradingcountry']);
  if(key==='invoiceSame'&&value==='yes')clear(['invoiceaddress1','invoiceaddress2','invoicecity','invoicepostcode','invoicecountry']);
  if(key==='consultantSame'&&value==='yes')clear(['opsName','opsJob','opsPhone','opsEmail']);
  if(key==='accountsSame'&&value==='yes')clear(['financeName','financeJob','financePhone','financeEmail']);
  if(key==='accountNameMatch'&&value==='yes')clear(['accountMismatchExplain']);
 }
 if(route!=='agency'&&['accountName','sortCode','accountNumber','confirmAccountNumber','bankName','bsr','accountOwner'].includes(key)){
  values.paymentConfirm='no';const confirmation=document.querySelector('[data-key="paymentConfirm"]');if(confirmation)confirmation.checked=false;
 }
 return true;
}
function handleRegistrationInput(event){
 if(!state.route)return;const input=event.target;
 if(input?.type==='checkbox'&&/^agreement/.test(input.id)){state.values[state.route][input.id]=input.checked?'yes':'no';delete state.errors[input.id];input.setAttribute('aria-invalid','false');return;}
 const key=input?.dataset?.key;if(!key)return;
 if(['businessType','vatRegistered','tradingSame','invoiceSame','accountsSame','consultantSame','accountNameMatch'].includes(key))return;
 updateRegistrationValue(state.route,key,input.type==='checkbox'?(input.checked?'yes':'no'):input.value);
 input.classList?.remove('invalid');input.setAttribute('aria-invalid','false');
 const errorId=state.route+'_'+key+'-error',error=document.getElementById(errorId);if(error)error.remove();
 document.querySelectorAll('[data-key="'+key+'"], #'+state.route+'_'+key).forEach(element=>{
  element.setAttribute('aria-invalid','false');
  const ids=(element.getAttribute('aria-describedby')||'').split(' ').filter(id=>id&&id!==errorId);
  if(ids.length)element.setAttribute('aria-describedby',ids.join(' '));else element.removeAttribute('aria-describedby');
 });
}
function handleRegistrationChange(event){
 if(!state.route)return;const input=event.target,key=input?.dataset?.key;if(!key)return;
 const changed=updateRegistrationValue(state.route,key,input.type==='checkbox'?(input.checked?'yes':'no'):input.value);
 if(changed&&['businessType','vatRegistered','tradingSame','invoiceSame','accountsSame','consultantSame','accountNameMatch'].includes(key)){
  const selected=input.value;render();
  const candidates=Array.from(document.querySelectorAll('[data-key="'+key+'"]'));
  const target=candidates.find(element=>element.value===selected)||candidates[0];if(target)target.focus({preventScroll:true});
 }
}
document.addEventListener('input',handleRegistrationInput);
document.addEventListener('change',handleRegistrationChange);
document.addEventListener('click',event=>{const link=event.target.closest?.('[data-error-focus]');if(link){event.preventDefault();registrationFocus(link.dataset.errorFocus);}});
window.addEventListener('hashchange',()=>{const key=window.location.hash.slice(1);if(Object.prototype.hasOwnProperty.call(routes,key)){if(state.route!==key)startRoute(key);}else if(key==='home'&&state.route)goHome();});
const routeHash=window.location.hash.slice(1);
if(Object.prototype.hasOwnProperty.call(routes,routeHash)){startRoute(routeHash)}else{goHome()};
